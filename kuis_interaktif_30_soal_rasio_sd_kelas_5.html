<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Interaktif Rasio - Matematika Kelas 5 SD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
        }
        h1, h2, h3, .font-heading {
            font-family: 'Fredoka', cursive;
        }
        .card-shadow {
            box-shadow: 0 8px 0px -2px rgba(0,0,0,0.06), 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        /* Style pecahan tegak lurus */
        .frac {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            font-size: 0.9em;
            line-height: 1;
            margin: 0 0.2em;
        }
        .frac .top {
            border-bottom: 2px solid currentColor;
            padding-bottom: 2px;
            font-weight: bold;
        }
        .frac .bottom {
            padding-top: 2px;
            font-weight: bold;
        }
    </style>
</head>
<body class="text-slate-800 pb-16">

    <!-- Header / Navbar -->
    <header class="bg-teal-600 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">🏆</span>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold leading-tight">Kuis Interaktif Rasio</h1>
                    <p class="text-xs md:text-sm text-teal-100 font-semibold">30 Soal Latihan Matematika Kelas 5 SD</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 mt-2 sm:mt-0">
                <button onclick="resetQuiz()" class="text-xs bg-amber-500 hover:bg-amber-600 text-white font-bold px-3 py-1.5 rounded-full shadow transition">
                    🔄 Ulang Kuis
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-6 space-y-6">

        <!-- Bar Kemajuan & Stats -->
        <section class="bg-white rounded-2xl p-4 card-shadow border-2 border-teal-200">
            <div class="flex flex-wrap justify-between items-center text-sm font-bold text-slate-700 mb-2 gap-2">
                <div>Progress Dijawab: <span id="answered-count" class="text-teal-600">0</span> / 30 Soal</div>
                <div>Skor Saat Ini: <span id="current-score" class="text-amber-600">0</span> / 30</div>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-3.5 overflow-hidden border">
                <div id="progress-bar" class="bg-teal-500 h-3.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

            <!-- Sidebar Navigasi Nomor Soal -->
            <aside class="lg:col-span-1 bg-white rounded-3xl p-5 card-shadow border-2 border-teal-200 h-fit">
                <h3 class="font-bold text-slate-700 mb-3 text-center flex items-center justify-center gap-2">
                    <span>📑</span> Navigasi Soal
                </h3>
                <div id="number-grid" class="grid grid-cols-5 gap-2">
                    <!-- Tombol Nomor Soal di-generate via JS -->
                </div>
                <div class="mt-4 pt-3 border-t text-xs space-y-1.5 font-semibold text-slate-600">
                    <div class="flex items-center gap-2">
                        <span class="w-3.5 h-3.5 rounded-full bg-slate-100 border-2 border-slate-300 inline-block"></span>
                        <span>Belum Dijawab</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3.5 h-3.5 rounded-full bg-emerald-500 inline-block"></span>
                        <span>Jawaban Benar</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3.5 h-3.5 rounded-full bg-rose-500 inline-block"></span>
                        <span>Jawaban Salah</span>
                    </div>
                </div>
            </aside>

            <!-- Card Wadah Soal -->
            <section class="lg:col-span-3 bg-white rounded-3xl p-6 md:p-8 card-shadow border-4 border-teal-200 flex flex-col justify-between space-y-6">
                
                <div class="space-y-4">
                    <!-- Top Info Soal -->
                    <div class="flex justify-between items-center border-b pb-3">
                        <span id="question-tag" class="bg-teal-100 text-teal-800 font-bold px-3 py-1 rounded-full text-xs uppercase tracking-wider">
                            Kategori Materi
                        </span>
                        <span id="question-number-title" class="font-bold text-slate-500 text-sm">
                            Soal 1 dari 30
                        </span>
                    </div>

                    <!-- Teks Soal -->
                    <div id="question-text" class="text-base md:text-lg font-bold text-slate-800 leading-relaxed min-h-[60px]">
                        <!-- Teks soal di-generate via JS -->
                    </div>

                    <!-- Pilihan Opsi (A, B, C, D) -->
                    <div id="options-container" class="space-y-3 pt-2">
                        <!-- Opsi pilihan di-generate via JS -->
                    </div>

                    <!-- Kotak Pembahasan & Umpan Balik Instan -->
                    <div id="feedback-box" class="hidden p-4 rounded-2xl border-2 space-y-1 text-sm">
                        <!-- Diisi via JS -->
                    </div>
                </div>

                <!-- Tombol Navigasi (Sebelumnya / Selanjutnya) -->
                <div class="flex justify-between items-center pt-4 border-t">
                    <button id="btn-prev" onclick="changeQuestion(-1)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-5 py-2.5 rounded-xl transition flex items-center gap-2">
                        ⬅️ Sebelumnya
                    </button>
                    <button id="btn-next" onclick="changeQuestion(1)" class="bg-teal-600 hover:bg-teal-700 text-white font-bold px-5 py-2.5 rounded-xl shadow transition flex items-center gap-2">
                        Selanjutnya ➡️
                    </button>
                </div>

            </section>
        </div>

    </main>

    <!-- Logic Javascript Kuis -->
    <script>
        // Data 30 Soal Rasio Variatif Kelas 5 SD (Kunci jawaban diacak murni & seimbang)
        const questions = [
            {
                id: 1,
                category: "Konsep Rasio",
                question: "Di sebuah taman bunga terdapat 12 kembang sepatu dan 18 bunga mawar. Rasio paling sederhana dari jumlah kembang sepatu terhadap bunga mawar adalah ...",
                options: ["3 : 4", "2 : 3", "3 : 2", "4 : 3"],
                answer: 1, // B
                explanation: "Bandingkan 12 : 18. Bagilah kedua bilangan dengan FPB-nya yaitu 6. Maka (12 ÷ 6) : (18 ÷ 6) = 2 : 3."
            },
            {
                id: 2,
                category: "Konsep Rasio",
                question: "Di dalam perpustakaan terdapat 24 buku cerita dan 36 buku pelajaran. Rasio sederhana buku pelajaran terhadap buku cerita adalah ...",
                options: ["3 : 2", "2 : 3", "4 : 3", "3 : 5"],
                answer: 0, // A
                explanation: "Perhatikan urutan pertanyaan: Buku Pelajaran (36) : Buku Cerita (24). Dibagi dengan 12 menjadi 3 : 2."
            },
            {
                id: 3,
                category: "Kesamaan Rasio",
                question: "Manakah di antara rasio berikut yang <b>senilai</b> dengan rasio 4 : 7?",
                options: ["8 : 12", "12 : 20", "16 : 24", "12 : 21"],
                answer: 3, // D
                explanation: "Rasio 4 : 7 dikalikan dengan 3 pada kedua sisinya menjadi (4 × 3) : (7 × 3) = 12 : 21."
            },
            {
                id: 4,
                category: "Rasio Satuan",
                question: "Harga 3 kg apel adalah Rp 45.000,00. Berapakah harga 1 kg apel?",
                options: ["Rp 12.000,00", "Rp 15.000,00", "Rp 16.000,00", "Rp 13.500,00"],
                answer: 1, // B
                explanation: "Untuk mencari rasio satuan (1 kg), bagilah harga total dengan jumlah kg: Rp 45.000 ÷ 3 = Rp 15.000,00."
            },
            {
                id: 5,
                category: "Bagian : Keseluruhan",
                question: "Sebuah kotak berisi 8 bola merah dan 12 bola biru. Rasio bola merah terhadap <b>seluruh bola</b> di dalam kotak adalah ...",
                options: ["3 : 5", "2 : 3", "2 : 5", "4 : 5"],
                answer: 2, // C
                explanation: "Total seluruh bola = 8 + 12 = 20. Rasio bola merah : Total = 8 : 20. Dibagi 4 menjadi 2 : 5."
            },
            {
                id: 6,
                category: "Kesamaan Rasio",
                question: "Apabila rasio 5 : 8 senilai dengan <div class=\"frac\"><span class=\"top\">15</span><span class=\"bottom\">n</span></div>, maka nilai n adalah ...",
                options: ["20", "30", "18", "24"],
                answer: 3, // D
                explanation: "Angka pertama dikali 3 (5 × 3 = 15). Maka angka kedua juga dikali 3 (8 × 3 = 24). Jadi n = 24."
            },
            {
                id: 7,
                category: "Rasio Durasi Waktu",
                question: "Deni membutuhkan waktu 20 menit untuk mandi, sedangkan Rian membutuhkan waktu 1 jam. Rasio durasi mandi Deni terhadap Rian adalah ...",
                options: ["1 : 3", "20 : 1", "1 : 2", "1 : 4"],
                answer: 0, // A
                explanation: "Samakan satuan ke menit. Waktu Rian = 1 jam = 60 menit. Rasio Deni : Rian = 20 : 60 (dibagi 20) = 1 : 3."
            },
            {
                id: 8,
                category: "Bagian : Bagian",
                question: "Siswa kelas 5 terdiri dari 15 siswa laki-laki dan 20 siswa perempuan. Rasio siswa perempuan terhadap siswa laki-laki adalah ...",
                options: ["3 : 4", "3 : 7", "4 : 3", "5 : 4"],
                answer: 2, // C
                explanation: "Perhatikan urutan: Perempuan (20) : Laki-laki (15). Dibagi 5 menjadi 4 : 3."
            },
            {
                id: 9,
                category: "Rasio Satuan",
                question: "Sebuah mobil menempuh jarak 180 km dalam waktu 3 jam. Kecepatan rata-rata mobil tersebut per jam (rasio satuan) adalah ...",
                options: ["60 km/jam", "50 km/jam", "70 km/jam", "45 km/jam"],
                answer: 0, // A
                explanation: "Jarak per 1 jam = 180 km ÷ 3 jam = 60 km/jam."
            },
            {
                id: 10,
                category: "Kesamaan Rasio",
                question: "Manakah pasangan rasio di bawah ini yang <b>TIDAK senilai</b>?",
                options: ["2 : 3 dan 6 : 9", "3 : 4 dan 9 : 16", "5 : 6 dan 15 : 18", "1 : 4 dan 4 : 16"],
                answer: 1, // B
                explanation: "3 : 4 jika dikali 3 hasilnya adalah 9 : 12, bukan 9 : 16. Jadi 3 : 4 dan 9 : 16 tidak senilai."
            },
            {
                id: 11,
                category: "Rasio Durasi Waktu",
                question: "Umur Kakak adalah 2 windu, sedangkan umur Adik adalah 4 tahun. Rasio umur Kakak terhadap umur Adik adalah ...",
                options: ["1 : 2", "2 : 1", "4 : 1", "8 : 1"],
                answer: 2, // C
                explanation: "1 windu = 8 tahun. Umur Kakak = 2 × 8 = 16 tahun. Rasio Kakak : Adik = 16 : 4 = 4 : 1."
            },
            {
                id: 12,
                category: "Konsep Rasio",
                question: "Bentuk sederhana dari pecahan perbandingan <div class=\"frac\"><span class=\"top\">28</span><span class=\"bottom\">42</span></div> adalah ...",
                options: ["3 : 4", "1 : 2", "4 : 5", "2 : 3"],
                answer: 3, // D
                explanation: "Bagi pembilang dan penyebut dengan FPB-nya yaitu 14. Maka (28 ÷ 14) / (42 ÷ 14) = 2 : 3."
            },
            {
                id: 13,
                category: "Rasio Satuan",
                question: "Pak Ahmad mendapat gaji Rp 300.000,00 untuk bekerja selama 5 hari. Berapakah gaji Pak Ahmad per hari?",
                options: ["Rp 60.000,00", "Rp 50.000,00", "Rp 65.000,00", "Rp 70.000,00"],
                answer: 0, // A
                explanation: "Gaji 1 hari = Rp 300.000 ÷ 5 = Rp 60.000,00."
            },
            {
                id: 14,
                category: "Bagian : Keseluruhan",
                question: "Dalam sebuah resep kue, dibutuhkan 3 cangkir gula dan 7 cangkir tepung. Rasio cangkir gula terhadap <b>total seluruh cangkir bahan</b> adalah ...",
                options: ["3 : 7", "3 : 10", "7 : 10", "3 : 4"],
                answer: 1, // B
                explanation: "Total cangkir bahan = 3 + 7 = 10 cangkir. Rasio gula : Total = 3 : 10."
            },
            {
                id: 15,
                category: "Kesamaan Rasio",
                question: "Rasio 9 : 15 jika disederhanakan ke bentuk yang paling sederhana menjadi ...",
                options: ["1 : 2", "3 : 4", "3 : 5", "4 : 5"],
                answer: 2, // C
                explanation: "Bagilah kedua angka dengan 3: (9 ÷ 3) : (15 ÷ 3) = 3 : 5."
            },
            {
                id: 16,
                category: "Rasio Durasi Waktu",
                question: "Lama waktu pengerjaan tugas A adalah 45 menit, sedangkan tugas B membutuhkan waktu 1,5 jam. Rasio waktu tugas A terhadap tugas B adalah ...",
                options: ["3 : 4", "2 : 3", "1 : 3", "1 : 2"],
                answer: 3, // D
                explanation: "Tugas B = 1,5 jam = 90 menit. Rasio A : B = 45 : 90 (dibagi 45) = 1 : 2."
            },
            {
                id: 17,
                category: "Bagian : Bagian",
                question: "Ibu membeli 10 buah jeruk nipis dan 15 buah jeruk manis. Rasio jeruk nipis terhadap jeruk manis adalah ...",
                options: ["2 : 3", "3 : 2", "2 : 5", "3 : 5"],
                answer: 0, // A
                explanation: "Jeruk nipis (10) : Jeruk manis (15). Bagilah kedua sisi dengan 5 menjadi 2 : 3."
            },
            {
                id: 18,
                category: "Kesamaan Rasio",
                question: "Rasio jumlah pensil Tono dan Ani adalah 2 : 5. Jika Tono memiliki 10 pensil, maka jumlah pensil Ani adalah ...",
                options: ["20 pensil", "25 pensil", "30 pensil", "15 pensil"],
                answer: 1, // B
                explanation: "Pensil Tono = 2 bagian = 10 pensil (berarti 1 bagian = 5 pensil). Maka pensil Ani = 5 bagian × 5 = 25 pensil."
            },
            {
                id: 19,
                category: "Rasio Satuan",
                question: "Sebuah printer mampu mencetak 40 lembar kertas dalam waktu 2 menit. Berapakah lembar kertas yang dapat dicetak printer tersebut dalam 1 menit?",
                options: ["15 lembar", "25 lembar", "20 lembar", "30 lembar"],
                answer: 2, // C
                explanation: "Cetak per 1 menit = 40 lembar ÷ 2 menit = 20 lembar/menit."
            },
            {
                id: 20,
                category: "Rasio Durasi Waktu",
                question: "Rasio durasi antara 2 hari terhadap 1 minggu adalah ...",
                options: ["2 : 5", "2 : 6", "1 : 3", "2 : 7"],
                answer: 3, // D
                explanation: "Samakan satuan ke hari. 1 minggu = 7 hari. Rasio = 2 hari : 7 hari = 2 : 7."
            },
            {
                id: 21,
                category: "Bagian : Keseluruhan",
                question: "Dari 30 siswa di kelas, 18 siswa menyukai olahraga basket dan sisanya menyukai sepak bola. Rasio siswa yang menyukai sepak bola terhadap <b>seluruh siswa</b> adalah ...",
                options: ["2 : 5", "3 : 5", "2 : 3", "1 : 3"],
                answer: 0, // A
                explanation: "Siswa suka sepak bola = 30 - 18 = 12 siswa. Rasio Sepak Bola : Total = 12 : 30 (dibagi 6) = 2 : 5."
            },
            {
                id: 22,
                category: "Kesamaan Rasio",
                question: "Toko Rezeki menjual 2 buku seharga Rp 8.000,00. Jika Bayu membeli 6 buku yang sama, berapa uang yang harus dibayar Bayu?",
                options: ["Rp 20.000,00", "Rp 18.000,00", "Rp 24.000,00", "Rp 30.000,00"],
                answer: 2, // C
                explanation: "Harga 1 buku = Rp 8.000 ÷ 2 = Rp 4.000. Harga 6 buku = 6 × Rp 4.000 = Rp 24.000,00."
            },
            {
                id: 23,
                category: "Rasio Durasi Waktu",
                question: "Perbandingan durasi 1 semester terhadap 1 tahun (dalam bulan) dapat dituliskan dalam bentuk rasio paling sederhana yaitu ...",
                options: ["1 : 3", "1 : 2", "1 : 4", "2 : 3"],
                answer: 1, // B
                explanation: "1 semester = 6 bulan, 1 tahun = 12 bulan. Rasio = 6 : 12 (dibagi 6) = 1 : 2."
            },
            {
                id: 24,
                category: "Konsep Rasio",
                question: "Di sebuah peternakan terdapat 40 ekor ayam dan 16 ekor bebek. Rasio paling sederhana dari jumlah bebek terhadap ayam adalah ...",
                options: ["5 : 2", "2 : 3", "3 : 5", "2 : 5"],
                answer: 3, // D
                explanation: "Urutan: Bebek (16) : Ayam (40). Bagilah kedua angka dengan FPB-nya yaitu 8. Maka (16 ÷ 8) : (40 ÷ 8) = 2 : 5."
            },
            {
                id: 25,
                category: "Rasio Satuan",
                question: "Seorang penjahit dapat menyelesaikan 15 potong baju dalam waktu 3 hari. Banyak baju yang diselesaikan dalam 1 hari adalah ...",
                options: ["4 baju", "6 baju", "5 baju", "3 baju"],
                answer: 2, // C
                explanation: "Baju per 1 hari = 15 ÷ 3 = 5 baju/hari."
            },
            {
                id: 26,
                category: "Bagian : Bagian",
                question: "Rasio luas kebun jagung terhadap kebun singkong milik Pak Tani adalah 3 : 4. Jika luas kebun jagung 150 m², maka luas kebun singkong adalah ...",
                options: ["200 m²", "180 m²", "220 m²", "160 m²"],
                answer: 0, // A
                explanation: "Kebun jagung = 3 bagian = 150 m² (1 bagian = 50 m²). Kebun singkong = 4 bagian × 50 m² = 200 m²."
            },
            {
                id: 27,
                category: "Rasio Durasi Waktu",
                question: "Rasio antara durasi 15 menit terhadap 1 jam adalah ...",
                options: ["1 : 2", "1 : 4", "1 : 3", "1 : 5"],
                answer: 1, // B
                explanation: "1 jam = 60 menit. Rasio = 15 : 60 (dibagi 15) = 1 : 4."
            },
            {
                id: 28,
                category: "Bagian : Keseluruhan",
                question: "Manakah bentuk rasio dari 25% terhadap 100% jika disederhanakan?",
                options: ["1 : 2", "1 : 3", "1 : 4", "2 : 3"],
                answer: 2, // C
                explanation: "25% : 100% = 25 : 100 (dibagi 25) = 1 : 4."
            },
            {
                id: 29,
                category: "Kesamaan Rasio",
                question: "Tiga buah rasio berikut senilai, KECUALI ...",
                options: ["1 : 3", "3 : 9", "4 : 12", "5 : 16"],
                answer: 3, // D
                explanation: "1:3 = 3:9 = 4:12 (semua bernilai 1/3). Sedangkan 5 : 16 jika disederhanakan tidak sama dengan 1 : 3 (harusnya 5 : 15)."
            },
            {
                id: 30,
                category: "Rasio Satuan",
                question: "Sebuah mesin minuman dapat mengisi 60 botol soda dalam waktu 5 menit. Rasio satuan pengisian botol per menit adalah ...",
                options: ["12 botol/menit", "10 botol/menit", "15 botol/menit", "14 botol/menit"],
                answer: 0, // A
                explanation: "Jumlah botol per 1 menit = 60 ÷ 5 = 12 botol/menit."
            }
        ];

        // State Kuis dengan LocalStorage
        let currentQuestionIndex = 0;
        let userAnswers = JSON.parse(localStorage.getItem('rasio_user_answers')) || {};

        // Inisialisasi saat window dimuat
        window.onload = function() {
            renderNumberGrid();
            loadQuestion(currentQuestionIndex);
            updateStats();
        };

        function renderNumberGrid() {
            const grid = document.getElementById('number-grid');
            grid.innerHTML = '';

            questions.forEach((q, index) => {
                const btn = document.createElement('button');
                btn.textContent = index + 1;
                btn.id = `nav-btn-${index}`;
                btn.className = `w-full aspect-square rounded-xl font-bold text-sm transition border-2 ${getNavBtnStyle(index)}`;
                btn.onclick = () => jumpToQuestion(index);
                grid.appendChild(btn);
            });
        }

        function getNavBtnStyle(index) {
            const answered = userAnswers[index];
            if (index === currentQuestionIndex) {
                return "ring-4 ring-amber-400 font-extrabold border-teal-600 shadow-md";
            }
            if (answered !== undefined) {
                return answered.isCorrect 
                    ? "bg-emerald-500 text-white border-emerald-600" 
                    : "bg-rose-500 text-white border-rose-600";
            }
            return "bg-slate-100 text-slate-700 border-slate-200 hover:bg-teal-50";
        }

        function updateNavGridStyles() {
            questions.forEach((q, index) => {
                const btn = document.getElementById(`nav-btn-${index}`);
                if (btn) {
                    btn.className = `w-full aspect-square rounded-xl font-bold text-sm transition border-2 ${getNavBtnStyle(index)}`;
                }
            });
        }

        function loadQuestion(index) {
            currentQuestionIndex = index;
            const q = questions[index];

            document.getElementById('question-tag').textContent = q.category;
            document.getElementById('question-number-title').textContent = `Soal ${index + 1} dari ${questions.length}`;
            document.getElementById('question-text').innerHTML = q.question;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const answered = userAnswers[index];
            const labels = ["A", "B", "C", "D"];

            q.options.forEach((opt, optIdx) => {
                const btn = document.createElement('button');
                btn.className = getOptionStyle(index, optIdx);
                btn.innerHTML = `<span class="font-bold mr-2 text-teal-700 bg-teal-100 px-2.5 py-0.5 rounded-lg">${labels[optIdx]}</span> ${opt}`;
                btn.onclick = () => selectAnswer(optIdx);
                if (answered !== undefined) {
                    btn.disabled = true;
                }
                container.appendChild(btn);
            });

            // Handle Umpan Balik Instan & Pembahasan
            const feedbackBox = document.getElementById('feedback-box');
            if (answered !== undefined) {
                feedbackBox.classList.remove('hidden');
                if (answered.isCorrect) {
                    feedbackBox.className = "p-4 rounded-2xl border-2 space-y-1 text-sm bg-emerald-50 border-emerald-300 text-emerald-900";
                    feedbackBox.innerHTML = `
                        <div class="font-bold text-base flex items-center gap-1.5 text-emerald-700">
                            <span>🎉 Jawaban Kamu Benar!</span>
                        </div>
                        <p class="mt-1"><b>Pembahasan:</b> ${q.explanation}</p>
                    `;
                } else {
                    feedbackBox.className = "p-4 rounded-2xl border-2 space-y-1 text-sm bg-rose-50 border-rose-300 text-rose-900";
                    feedbackBox.innerHTML = `
                        <div class="font-bold text-base flex items-center gap-1.5 text-rose-700">
                            <span>❌ Jawaban Kurang Tepat</span>
                        </div>
                        <p class="mt-1">Jawaban yang benar adalah <b>${labels[q.answer]}. ${q.options[q.answer]}</b></p>
                        <p class="mt-1"><b>Pembahasan:</b> ${q.explanation}</p>
                    `;
                }
            } else {
                feedbackBox.classList.add('hidden');
            }

            // State tombol Navigasi Prev/Next
            document.getElementById('btn-prev').disabled = (index === 0);
            document.getElementById('btn-prev').style.opacity = (index === 0) ? "0.5" : "1";
            
            const btnNext = document.getElementById('btn-next');
            if (index === questions.length - 1) {
                btnNext.innerHTML = `Selesai 🎉`;
            } else {
                btnNext.innerHTML = `Selanjutnya ➡️`;
            }

            updateNavGridStyles();
        }

        function getOptionStyle(qIdx, optIdx) {
            const answered = userAnswers[qIdx];
            const base = "w-full text-left p-4 rounded-2xl font-semibold border-2 transition flex items-center justify-start ";

            if (answered === undefined) {
                return base + "bg-slate-50 border-slate-200 text-slate-800 hover:bg-teal-50 hover:border-teal-300";
            }

            if (optIdx === questions[qIdx].answer) {
                return base + "bg-emerald-100 border-emerald-500 text-emerald-900 font-bold ring-2 ring-emerald-300";
            }

            if (optIdx === answered.selectedOption && !answered.isCorrect) {
                return base + "bg-rose-100 border-rose-500 text-rose-900 font-bold";
            }

            return base + "bg-slate-50 border-slate-200 text-slate-400 opacity-60";
        }

        function selectAnswer(optIdx) {
            if (userAnswers[currentQuestionIndex] !== undefined) return;

            const isCorrect = (optIdx === questions[currentQuestionIndex].answer);
            userAnswers[currentQuestionIndex] = {
                selectedOption: optIdx,
                isCorrect: isCorrect
            };

            // Simpan otomatis ke localStorage
            localStorage.setItem('rasio_user_answers', JSON.stringify(userAnswers));

            loadQuestion(currentQuestionIndex);
            updateStats();
        }

        function changeQuestion(step) {
            const newIndex = currentQuestionIndex + step;
            if (newIndex >= 0 && newIndex < questions.length) {
                loadQuestion(newIndex);
            }
        }

        function jumpToQuestion(index) {
            loadQuestion(index);
        }

        function updateStats() {
            const answeredKeys = Object.keys(userAnswers);
            const answeredCount = answeredKeys.length;
            let score = 0;

            answeredKeys.forEach(key => {
                if (userAnswers[key].isCorrect) score++;
            });

            document.getElementById('answered-count').textContent = answeredCount;
            document.getElementById('current-score').textContent = score;

            const percentage = (answeredCount / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        function resetQuiz() {
            if (confirm("Apakah kamu yakin ingin mengulang kuis dari awal? Semua jawaban akan direset.")) {
                userAnswers = {};
                localStorage.removeItem('rasio_user_answers');
                currentQuestionIndex = 0;
                renderNumberGrid();
                loadQuestion(0);
                updateStats();
            }
        }
    </script>
</body>
</html>
